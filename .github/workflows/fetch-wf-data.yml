name: Fetch Warframe Data

on:
  schedule:
    # 每 8 小时运行一次：UTC 00:00, 08:00, 16:00
    # 对应北京时间 08:00, 16:00, 次日 00:00
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:       # 允许手动触发（调试用）

concurrency:
  group: fetch-wf-data
  cancel-in-progress: false

permissions:
  contents: write          # 需要写权限才能 commit & push

jobs:
  fetch:
    # 固定 Ubuntu 版本，避免 latest 自动迁移带来的不确定性
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # 升级到 v5，支持 Node.js 24
      - uses: actions/checkout@v5

      # 升级到 v6，支持 Node.js 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Fetch data
        run: python scripts/fetch_wf_data.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 必须同时提交数据文件夹和修复状态文件
          git add data/ scripts/repair_state.json

          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore(data): update WF data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push