name: Update Lua Scripts Manifest

on:
  push:
    branches:
      - main # 或者你的默认分支名
    paths:
      - 'luascripts/**' # 只在 luascripts 目录有变动时触发

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写权限来提交更改

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate manifest with SHA256
        run: python scripts/gen_manifest.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update luascripts manifest [skip ci]"
          file_pattern: update.json # 只提交 update.json 文件的变动